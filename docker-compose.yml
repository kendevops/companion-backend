version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: companion-api
    restart: always
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - DATABASE_URL="postgresql://postgres:jackCompanio@database-1.cfyky8s6ucmi.ap-southeast-2.rds.amazonaws.com:5432/companion?schema=public"
      # - DATABASE_URL=postgresql://neondb_owner:npg_Jt7UmoL9ufFr@ep-cool-heart-a57hztx8-pooler.us-east-2.aws.neon.tech/companion?sslmode=require
      - JWT_SECRET=your-jwt-secret-key-change-in-production
      - PORT=3001
      - UPLOAD_DIR=./uploads
      - MAX_FILE_SIZE=5242880
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db
    networks:
      - companion-network

  db:
    image: postgres:14
    container_name: companion-db
    restart: always
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=jackCompanio
      - POSTGRES_DB=companion
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - companion-network

volumes:
  postgres-data:
  uploads:

networks:
  companion-network:
    driver: bridge