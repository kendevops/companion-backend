version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: companion-api
    restart: always
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/companion?schema=public
      - JWT_SECRET=your-jwt-secret-key-change-in-production
      - PORT=3001
      - UPLOAD_DIR=./uploads
      - MAX_FILE_SIZE=5242880
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db
    networks:
      - companion-network

  db:
    image: postgres:14
    container_name: companion-db
    restart: always
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=companion
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - companion-network

volumes:
  postgres-data:
  uploads:

networks:
  companion-network:
    driver: bridge